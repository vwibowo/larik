# Larik static website, deployed to Cloudflare Pages.
#
# The site is a Go program: `go run .` builds a fresh ./dist. Deploy the
# built directory with Pages:
#
#   npm run deploy            # build, then publish dist to the "larik" project
#   npm run pages-preview     # preview dist locally
#
# Publishing needs a wrangler login or CLOUDFLARE_API_TOKEN, and the Pages
# project name (here "larik", passed with --project-name). This file documents
# that; `wrangler pages deploy` uploads a directory directly and needs no
# [site]/[build] tables.

name = "larik"
